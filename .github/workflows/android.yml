name: Android
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor
        run: npm install --no-save --ignore-scripts @capacitor/core@8.5.2 @capacitor/android@8.5.2 @capacitor/cli@8.5.2
      - name: Build web
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Install native bridge
        run: |
          cp android-template/app/toetoetoe/luz/*.java android/app/src/main/java/app/toetoetoe/luz/
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Collect build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="commit-${GITHUB_SHA:0:12}"
          fi
          mkdir -p "releases/$version"
          cp android/app/build/outputs/apk/debug/app-debug.apk "releases/$version/luz-$version-debug.apk"
          printf '%s\n' "$GITHUB_SHA" > "releases/$version/SHA.txt"
          (cd "releases/$version" && sha256sum "luz-$version-debug.apk" > SHA256SUMS.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luz-android-${{ env.VERSION }}
          path: releases/
          if-no-files-found: error
          retention-days: 90
      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd releases && zip -qr "luz-${VERSION}-android.zip" "$VERSION")
          zip -qr "releases/xiaomi-home-${VERSION}-web.zip" dist server.mjs package.json
          gh release create "$GITHUB_REF_NAME" "releases/$VERSION/luz-$VERSION-debug.apk" "releases/luz-$VERSION-android.zip" "releases/$VERSION/SHA256SUMS.txt" "releases/xiaomi-home-${VERSION}-web.zip" --title "$GITHUB_REF_NAME" --notes "APK de depuración. Commit: $GITHUB_SHA. La compatibilidad con la ampolleta requiere validación física."
