name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm test
      - run: npm run build
      - name: Package
        run: |
          mkdir -p releases
          cp -r dist releases/dist
          cp server.mjs package.json releases/
          printf '%s\n' "$GITHUB_SHA" > releases/SHA.txt
          cd releases && zip -qr "xiaomi-home-${GITHUB_SHA}.zip" dist server.mjs package.json SHA.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiaomi-home-${{ github.sha }}
          path: releases/
          retention-days: 90
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" releases/*.zip --title "$GITHUB_REF_NAME" --notes "Build: $GITHUB_SHA"
